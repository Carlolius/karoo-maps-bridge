[versions]
agp = "8.5.2"
kotlin = "2.0.21"
karooExt = "1.1.8" # latest release documented for Karoo 2 (needs KOS 1.613.2351); 1.1.9 lists only Karoo 3
junit = "4.13.2"
orgJson = "20240303"
androidxCore = "1.13.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
hammerhead-karoo-ext = { group = "io.hammerhead", name = "karoo-ext", version.ref = "karooExt" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
